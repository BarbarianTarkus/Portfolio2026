# Dune runtime configuration.
#
# The public site renders through the Fresh routes in ./routes; Dune provides
# the content index behind lib/content.ts and the /admin editing UI.
content:
  dir: content
debug: false

# Multilingual content: page variants live next to the default file, distinguished
# by a language suffix (content/02.about/default.en.md). The default language
# keeps unprefixed URLs (/about); the rest are served under /<lang>/ (/en/about).
languages:
  supported: [es, en, ca]
  default: es
  include_default_in_url: false

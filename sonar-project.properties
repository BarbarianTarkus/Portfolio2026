# SonarQube analysis configuration
# Server: https://sonarqube.verduguez.com
# Docs:   https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=Portfolio
sonar.projectName=Ricardo Portfolio
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarqube.verduguez.com

sonar.sourceEncoding=UTF-8

# Application code: Fresh (Deno/TypeScript/Preact) routes, islands, components,
# shared data and the build/preview tooling. Styles are plain CSS (analysed as
# CSS), while generated output and dependencies are excluded.
sonar.sources=routes,components,islands,data,scripts,config.ts,main.ts,client.ts,utils.ts,vite.config.ts,static/styles
sonar.exclusions=node_modules/**,_fresh/**,dist/**,.github/**,.agents/**,design-system/**,**/*.md,**/*.png,**/*.svg,**/deno.lock

# No automated tests yet; tests will be wired in here once they exist.
# sonar.tests=
# sonar.test.inclusions=

# CSS: the stylesheet is hand-written, keep the analysis focused on code smells.
sonar.css.stylelint.reportPaths=

# Coverage: none generated today. `deno task ssg` verifies links, not coverage.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
